<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background dark circle -->
  <circle cx="16" cy="16" r="15" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5" />
  <!-- Glowing signal waves -->
  <path d="M 8,13 A 11,11 0 0,1 24,13" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
  <path d="M 11,16 A 7,7 0 0,1 21,16" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <!-- Ascending volume/strength indicator bars -->
  <rect x="9" y="18" width="2.5" height="4" rx="0.75" fill="#334155" />
  <rect x="13.5" y="14" width="2.5" height="8" rx="0.75" fill="#059669" />
  <rect x="18" y="9" width="2.5" height="13" rx="0.75" fill="url(#brandGrad)" />
  <!-- Ascending price trend line -->
  <path d="M 7,19 L 12,14 L 17,16 L 24,9" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="24" cy="9" r="2" fill="#60a5fa" />
</svg>
